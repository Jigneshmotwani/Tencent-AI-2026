    type: tool.builtin
    label: Close with note
    config:
      tool: jira.comment
      params:
        issue_key: '{{nodes.get_alert.output.content.jira_issue}}'
        body: 'SYNTHETIC DEMO. Alert {{inputs.alert_id}} closed by the Transaction Investigator as {{nodes.check_citations.output.result.risk}}
          risk.


          {{nodes.check_citations.output.result.rationale}}'
    position:
      x: 20.0
      y: 728.0
