name: Transaction Investigator
description: Investigates a transaction-monitoring alert against the AML policy and drafts an STR for compliance approval
  when the risk is high.
icon: spark
owner: compliance
status: published
template_key: transaction_investigator
spec:
  name: Transaction Investigator
  icon: spark
  description: Investigates a transaction-monitoring alert against the AML policy and drafts an STR for compliance approval
    when the risk is high.
  trigger:
    type: manual
    config: {}
  inputs:
  - name: alert_id
    type: string
    required: true
    description: Alert ID, e.g. ALR-2291
  nodes:
  - id: alert
    type: trigger.manual
    label: Alert received
    config: {}
    position:
      x: 0
      y: 0
  - id: get_alert
    type: tool.mcp
    label: Get alert
    config:
      server: txn-monitoring
      tool: get_alert
      arguments:
        alert_id: '{{inputs.alert_id}}'
    position:
      x: 0
      y: 88
  - id: find_evidence
    type: knowledge.retrieve
    label: Find policy & case history
    config:
      query: AML policy red-flag typologies STR {{nodes.get_alert.output.content.rule.name}} {{nodes.get_alert.output.content.customer.name}}
        {{inputs.alert_id}} prior case
      sources:
      - confluence
      - drive
      - jira
      max_documents: 8
    position:
      x: 0
      y: 176
  - id: mask_pii
    type: guardrail.input
    label: Mask PII
    config:
      pii:
      - nric
      - iban
      - card
      - phone
      - email
      injection: true
      on_injection: quarantine
    position:
      x: 0
      y: 264
  - id: investigate
    type: llm.generate
    label: Investigate
    config:
      prompt: 'Investigate transaction-monitoring alert {{inputs.alert_id}} for Compliance (synthetic demo data).

        Summarise the alert''s transactions and counterparties and assess them against the red-flag typologies in the approved
        AML policy.

        Return risk (low, medium or high), typologies, a rationale that cites [E#] after every factual sentence, and the evidence_ids
        used.'
      include_evidence: true
      output_schema:
        type: object
        additionalProperties: false
        required:
        - risk
        - typologies
        - rationale
        - evidence_ids
        properties:
          risk:
            enum:
            - low
            - medium
            - high
          typologies:
            type: array
            items:
              type: string
            description: Typology codes, e.g. rapid_movement, new_counterparties
          rationale:
            type: string
            description: 3 to 5 sentences; every factual sentence cites [E#]
          evidence_ids:
            type: array
            items:
              type: string
      max_tokens: 1500
    position:
      x: 0
      y: 352
  - id: check_citations
    type: guardrail.output
    label: Check citations
    config:
      target: investigate
      grounding: true
      schema: true
      pii_leak: true
      on_fail: strip
    position:
      x: 0
      y: 440
  - id: risk_router
    type: logic.router
    label: Risk ≥ high?
    config:
      value: '{{nodes.check_citations.output.result.risk}}'
      cases:
      - high
      default: low_medium
    position:
      x: 0
      y: 528
  - id: draft_str
    type: llm.generate
    label: Draft STR
    config:
      prompt: 'Draft an STR narrative for alert {{inputs.alert_id}} from this checked risk assessment, following the template

        sections of the STR Drafting Guide (subject, who, what, when, why it is suspicious, prior history, actions taken).

        Risk: {{nodes.check_citations.output.result.risk}}

        Typologies: {{nodes.check_citations.output.result.typologies}}

        Assessment: {{nodes.check_citations.output.result.rationale}}

        State who, what, when and why it is suspicious. State facts, not conclusions; about 200 words; cite [E#] after factual
        sentences.

        Do not include customer-facing language, NRIC numbers or phone numbers. Return {"subject": "...", "narrative": "..."}.'
      include_evidence: true
      output_schema:
        type: object
        additionalProperties: false
        required:
        - subject
        - narrative
        properties:
          subject:
            type: string
            description: One line naming the activity and dates, e.g. "Rapid movement of funds, 12 to 14 Oct" (no alert id)
          narrative:
            type: string
      max_tokens: 1200
    position:
      x: -140
      y: 616
  - id: compliance_approval
    type: human.approval
    label: Compliance approval
    config:
      title: File STR case for {{inputs.alert_id}} in FINCRIME
      approver_roles:
      - builder
      - admin
      approver_group: Compliance leads
      allow_requester: false
      respond_within: 1 business day
      message: Review the drafted STR before it is filed to Jira.
    position:
      x: -140
      y: 704
  - id: file_str
    type: tool.builtin
    label: File STR case
    config:
      tool: jira.create_issue
      params:
        project_key: FINCRIME
        issue_type: Task
        labels:
        - str
        - synthetic-demo
        summary: 'STR {{inputs.alert_id}}: {{nodes.draft_str.output.subject}}'
        description: 'SYNTHETIC DEMO. STR draft prepared by the Transaction Investigator for alert {{inputs.alert_id}} (risk
          {{nodes.check_citations.output.result.risk}}). Approved in-app by Compliance leads before filing.


          {{nodes.draft_str.output.narrative}}'
    position:
      x: -140
      y: 792
  edges:
  - id: e_alert_get_alert
    source: alert
    target: get_alert
  - id: e_get_alert_find_evidence
    source: get_alert
    target: find_evidence
  - id: e_find_evidence_mask_pii
    source: find_evidence
    target: mask_pii
  - id: e_mask_pii_investigate
    source: mask_pii
    target: investigate
  - id: e_investigate_check_citations
    source: investigate
    target: check_citations
  - id: e_check_citations_risk_router
    source: check_citations
    target: risk_router
  - id: e_risk_router_draft_str_high
    source: risk_router
    target: draft_str
    sourceHandle: high
  - id: e_draft_str_compliance_approval
    source: draft_str
    target: compliance_approval
  - id: e_compliance_approval_file_str
    source: compliance_approval
    target: file_str
  policies:
    model_alias: ''
    max_steps: 20
    max_tokens_per_run: 60000
    budget_usd: 2.0
    allowed_sources:
    - drive
    - confluence
    - jira
    allowed_tools:
    - mcp:txn-monitoring/get_alert
    - builtin:jira.create_issue
    approval_required_for:
    - jira.comment
    - jira.transition
    - jira.create_issue
  audience: &id001
    kind: group
    groups:
    - Compliance
    roles: []
    users: []
audience: *id001
draft_spec:
