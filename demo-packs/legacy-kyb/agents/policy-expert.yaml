name: Policy Expert
description: Q&A over policies and regulations, with citations.
icon: book
owner: admin
status: published
template_key: policy_qa
spec:
  name: Policy Q&A Assistant
  icon: book-open
  description: Answers KYB/AML policy questions from Confluence and Drive (and Slack, when configured) with citations and
    conflict flagging.
  trigger:
    type: chat
    config: {}
  inputs:
  - name: question
    type: string
    required: true
    description: Policy question
  nodes:
  - id: trigger
    type: trigger.chat
    label: Question
    config: {}
    position:
      x: 0
      y: 100
  - id: retrieve
    type: knowledge.retrieve
    label: Search policy sources
    config:
      query: '{{inputs.question}}'
      sources:
      - confluence
      - drive
      max_documents: 6
    position:
      x: 260
      y: 100
  - id: guard_in
    type: guardrail.input
    label: PII + injection screen
    config:
      injection: true
    position:
      x: 520
      y: 100
  - id: answer
    type: llm.generate
    label: Answer with citations
    config:
      prompt: 'Answer the question using only the evidence. Cite [E#] after every factual sentence. If the approved Confluence
        policy

        and an older Slack message disagree, say so explicitly, follow the approved policy and cite both. If the evidence
        is insufficient,

        say what is missing. Be concise: at most about 250 words, short bullets. Question: {{inputs.question}}'
      include_evidence: true
      max_tokens: 1800
    position:
      x: 780
      y: 100
  - id: guard_out
    type: guardrail.output
    label: Grounding check
    config:
      target: answer
      grounding: true
      on_fail: strip
    position:
      x: 1040
      y: 100
  - id: output
    type: output
    label: Answer
    config:
      template: '{{nodes.guard_out.output.result.text}}'
    position:
      x: 1300
      y: 100
  edges:
  - id: e_trigger_retrieve
    source: trigger
    target: retrieve
  - id: e_retrieve_guard_in
    source: retrieve
    target: guard_in
  - id: e_guard_in_answer
    source: guard_in
    target: answer
  - id: e_answer_guard_out
    source: answer
    target: guard_out
  - id: e_guard_out_output
    source: guard_out
    target: output
  policies:
    model_alias: ''
    max_steps: 10
    max_tokens_per_run: 20000
    budget_usd: 1.0
    allowed_sources:
    - drive
    - confluence
    - jira
    allowed_tools: []
    approval_required_for:
    - jira.comment
    - jira.transition
    - jira.create_issue
  audience: &id001
    roles:
    - user
    users: []
    groups: []
audience: *id001
