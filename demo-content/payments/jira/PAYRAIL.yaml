    summary: "VN rail: migrate to partner API v3"
    issue_type: Task
    status: In Progress
    priority: High
    labels: [vn-rail]
    due: 2026-11-20
    assignee_persona: arjun
    description: |
      Migrate vn-rail-adapter from VN Partner API v2 (https://api.vnpartner.example/v2) to API v3 (https://api.vnpartner.example/v3).

      Scope:
      - v3 OAuth2 client-credentials auth (VNR-2, done by the contractor team).
      - v3 payout status code mapping, including the new PENDING_REVIEW state (VNR-1, done).
      - Sandbox end-to-end tests on v3 (VNR-3, in progress).
      - Partner UAT sign-off (VNR-5, blocked on the partner).
      - Cutover plan and rollback to v2 (VNR-6, done).
      - payout-orchestrator: handle PENDING_REVIEW as non-terminal "Processing".

      Contractor work by Lumen Integrations is tracked in the VNR project. Launch checklist is in the Vietnam Rail Integration space.

      Dependencies: PAYRAIL-415 (sandbox 502 on payout status) blocks VNR-3 and therefore UAT.

      Target: production cutover by 20 Nov 2026, outside the change-freeze calendar.

      SYNTHETIC DEMO DATA.
