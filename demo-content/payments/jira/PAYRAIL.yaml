      - "[Arjun Mehta, 8 Oct] Sandbox status polling is failing with 502s, raised PAYRAIL-415. This blocks the e2e suite."
  - number: 415
    summary: "Blocked: VN sandbox returns 502 on payout status"
    issue_type: Bug
    status: Blocked
    priority: High
    labels: [vn-rail, partner]
    assignee_persona: arjun
    description: |
      Raised Thu 8 Oct 2026.

      GET https://sandbox.vnpartner.example/v3/payouts/{id}/status returns HTTP 502 Bad Gateway for every payout created in the sandbox since Wed 7 Oct. Payout creation (POST /v3/payouts) still returns 201.

      Impact: sandbox end-to-end tests on v3 (VNR-3) cannot pass, so partner UAT (VNR-5) cannot start. This is blocking VN cutover (PAYRAIL-410).

      Raised with VN Partner integration support on 8 Oct with sample payout ids and timestamps (ICT).

      SYNTHETIC DEMO DATA.
    comments:
      - "[Arjun Mehta, 8 Oct] Reproduced with 20 sandbox payouts, 100% 502 on status. Partner ticket opened."
      - "[Arjun Mehta, 9 Oct] VN partner says the sandbox fix lands 14 Oct. Keeping this Blocked until we see green status calls."
