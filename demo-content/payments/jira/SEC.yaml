    description: |
      Source: September 2026 external penetration test (Harbourline Assurance, fictional), finding P-08, severity Medium.

      vn-rail-adapter uses a TLS client library version covered by vendor advisory TLSLIB-2026-03 (synthetic). A malicious or impersonated partner server could cause excessive CPU use during the handshake.

      Engineering remediation: PAYRAIL-421 (worded as "security remediation, upgrade due").

      Remediation deadline: 28 Oct 2026, which falls inside the October payroll freeze; deploy before 25 Oct or request a freeze exception.

