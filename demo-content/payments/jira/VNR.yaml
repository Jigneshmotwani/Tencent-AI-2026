issues:
  - number: 1
    summary: "Map v3 payout status codes"
    issue_type: Task
    status: Done
    priority: High
    labels: [vn-rail, v3]
    assignee_persona: marco
    description: |
      Map VN Partner API v3 payout status codes to Northstar payout statuses in vn-rail-adapter.

      Mapping agreed:
      - PENDING -> Processing (non-terminal)
      - PENDING_REVIEW -> Processing (non-terminal, partner compliance hold)
      - SETTLED -> Paid (terminal)
      - REJECTED -> Failed (terminal, do not retry)
      - RETURNED -> Returned (terminal)

      v2 numeric codes (00, 05, 12, 21) stay supported until cutover.

      SYNTHETIC DEMO DATA.
    comments:
      - "[Marco Rossi, 29 Sep] Mapping implemented with unit tests for every v2 and v3 code."
      - "[Arjun Mehta, 30 Sep] Reviewed and merged."
