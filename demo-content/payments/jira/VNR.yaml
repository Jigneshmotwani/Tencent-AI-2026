    priority: Medium
    labels: [vn-rail, v3]
    assignee_persona: marco
    description: |
      Cutover plan for switching vn-rail-adapter from v2 to v3 in production.

      - Switch base URL and auth mode by config, behind payouts.vn.enabled.
      - Pause VN payouts for under 10 minutes during the switch; payout-orchestrator queues retries.
      - Rollback: switch config back to v2 (only possible while the partner still serves v2).
      - Cutover window must be outside the month-end and payroll change freezes.

