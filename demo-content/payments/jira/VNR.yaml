    issue_type: Task
    status: Done
    priority: High
    labels: [vn-rail, v3]
    assignee_persona: marco
    description: |
      Implement the OAuth2 client-credentials flow for VN Partner API v3 in vn-rail-adapter.

      - Token endpoint: https://api.vnpartner.example/v3/oauth/token (sandbox: https://sandbox.vnpartner.example/v3/oauth/token).
      - Cache tokens, refresh at 80% of lifetime.
      - Client secret read from the secrets manager; never logged.
      - Mutual TLS still required.

      SYNTHETIC DEMO DATA.
