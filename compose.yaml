name: tencent-ai-2026
# All host bindings are loopback-only. Observability configs live in ./observability (W5-owned).
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/start.sh to initialize local configuration}
      POSTGRES_DB: app
    ports: ["127.0.0.1:${LOCAL_PORT_DB:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 2s
      retries: 20
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:${LOCAL_PORT_COLLECTOR:-4318}:4318"]
    depends_on: [tempo]
  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["127.0.0.1:${LOCAL_PORT_TEMPO:-3200}:3200"]
  prometheus:
    image: prom/prometheus:v3.13.4
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:${LOCAL_PORT_PROMETHEUS:-9090}:9090"]
  grafana:
    image: grafana/grafana:13.0.10
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/start.sh}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:${LOCAL_PORT_GRAFANA:-3000}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Run scripts/start.sh}
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:${LOCAL_PORT_GRAFANA:-3000}:3000"]
    depends_on: [prometheus, tempo, postgres]
volumes:
  postgres-data:
  tempo-data:
  prometheus-data:
  grafana-data:
