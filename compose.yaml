name: tencent-ai-2026
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/start.sh to initialize local configuration}
      POSTGRES_DB: app
    ports: ["127.0.0.1:${LOCAL_PORT_DB:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
